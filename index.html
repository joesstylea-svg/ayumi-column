<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MUSUBI コンテンツ管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;600;700&family=Shippori+Mincho+B1:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-soft: #F4F4F4;
  --dark: #111111;
  --text: #111111;
  --muted: #666666;
  --border: #E2E2E2;
  --accent: #111111;
  --accent-dark: #000000;
  --green: #1A7A4A;
  --green-bg: rgba(26,122,74,0.08);
  --shadow: rgba(0,0,0,0.05);
  --shadow-md: rgba(0,0,0,0.10);
  --r: 12px;
  --r-sm: 8px;
  --r-pill: 100px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;overflow-x:hidden;max-width:100vw;}
body{
  font-family:'Noto Sans JP',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;font-size:15px;line-height:1.7;
  overflow-x:hidden;max-width:100vw;width:100%;
}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* ── HEADER ── */
.hdr{
  background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:300;
  height:58px;display:flex;align-items:center;
  padding:0 24px;gap:16px;
}
.hdr-logo{display:flex;align-items:baseline;gap:9px;text-decoration:none;flex-shrink:0;}
.logo-t{font-family:'Shippori Mincho B1',serif;font-size:19px;font-weight:700;color:var(--dark);letter-spacing:4px;}
.logo-s{font-size:11px;color:var(--muted);letter-spacing:1px;}
.hdr-nav{display:flex;align-items:center;gap:2px;margin-left:auto;}
.hdr-nav-item{
  display:flex;align-items:center;gap:5px;
  padding:7px 14px;border-radius:var(--r-pill);
  font-size:13px;font-family:inherit;cursor:pointer;
  border:none;background:transparent;color:var(--muted);
  transition:all 0.2s;white-space:nowrap;
}
.hdr-nav-item:hover{color:var(--accent);background:var(--surface-soft);}
.hdr-nav-item.active{background:var(--dark);color:#fff;}
.hamburger{
  display:none;background:none;border:none;cursor:pointer;
  color:var(--dark);font-size:20px;margin-left:auto;padding:4px 6px;
}

/* ── BODY LAYOUT ── */
/* Desktop: sidebar + content */
.body-wrap{
  display:flex;
  min-height:calc(100vh - 58px);
}
.sidebar{
  width:280px;flex-shrink:0;
  padding:20px 18px;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:14px;
  position:sticky;top:58px;
  height:calc(100vh - 58px);
  overflow-y:auto;
  background:var(--bg);
}
.content-wrap{
  flex:1;min-width:0;
  display:flex;flex-direction:column;
}

/* ── PHASE CARD ── */
.phase-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 16px;
  position:relative;overflow:hidden;
}
.phase-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--phase-color,var(--accent));
}
.phase-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3px;}
.phase-label{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--phase-color,var(--accent));text-transform:uppercase;}
.phase-sub{font-size:11px;color:var(--muted);}
.phase-count{
  font-family:'Shippori Mincho B1',serif;
  font-size:22px;font-weight:700;color:var(--dark);
  margin:4px 0 2px;line-height:1;
}
.phase-count span{font-size:13px;color:var(--muted);font-family:'Noto Serif JP',serif;font-weight:400;}
.phase-bar-track{height:6px;background:var(--surface-soft);border-radius:3px;margin:8px 0 5px;overflow:hidden;}
.phase-bar-fill{height:100%;border-radius:3px;background:var(--phase-color,var(--accent));transition:width 0.6s ease;}
.phase-next{font-size:11px;color:var(--muted);}

/* ── WEEKLY PACE ── */
.pace-row{display:flex;align-items:center;gap:6px;margin-top:8px;}
.pace-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;transition:all 0.2s;}
.pace-dot.done{background:var(--green);border-color:var(--green);}
.pace-dot.today{background:var(--surface-soft);border-color:var(--accent);border-style:dashed;}
.pace-label{font-size:12px;color:var(--muted);margin-left:2px;}
.pace-streak{
  display:flex;align-items:center;gap:5px;
  font-size:12px;color:var(--accent);font-weight:600;
  margin-top:6px;
}

/* ── REMINDER ── */
.reminder-card{
  background:var(--surface-soft);
  border:1px solid var(--border);border-radius:var(--r);
  padding:14px 16px;position:relative;
}
.reminder-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent-dark));
}
.reminder-title{
  font-size:10px;font-weight:600;color:var(--accent);
  letter-spacing:1px;margin-bottom:9px;
  display:flex;align-items:center;justify-content:space-between;gap:5px;
}
.reminder-keep{
  font-family:'Shippori Mincho B1',serif;
  font-size:11px;color:var(--accent);opacity:0.6;
  font-style:italic;letter-spacing:1px;
  flex-shrink:0;
}
.reminder-list{display:flex;flex-direction:column;gap:6px;}
.reminder-item{
  display:flex;align-items:flex-start;gap:7px;
  font-size:13px;color:var(--dark);line-height:1.6;
  word-break:keep-all;overflow-wrap:break-word;
}
.reminder-item::before{content:'□';color:var(--accent);flex-shrink:0;font-size:10px;margin-top:2px;}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:10px 12px;
  box-shadow:0 1px 3px var(--shadow);
  display:flex;align-items:center;gap:9px;
}
.stat-icon{font-size:15px;flex-shrink:0;}
.stat-num{font-size:22px;font-weight:700;color:var(--dark);line-height:1;font-family:'Shippori Mincho B1',serif;}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px;}

/* ── ADD CTA ── */
.add-cta{
  width:100%;padding:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;border:none;border-radius:var(--r);
  font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:0 3px 12px rgba(0,0,0,0.12);
  transition:all 0.2s;letter-spacing:0.5px;
}
.add-cta:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(0,0,0,0.18);}
.add-cta:active{transform:translateY(0);}

/* ── KOTOBA ── */
.kotoba-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 16px;
  position:relative;
}
.kotoba-deco{
  position:absolute;bottom:8px;right:8px;
  font-size:36px;opacity:0.07;pointer-events:none;
  line-height:1;
}
.kotoba-label{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:7px;}
.kotoba-text{font-size:14px;color:var(--dark);line-height:1.9;font-style:italic;padding-right:20px;}
.kotoba-btns{
  display:flex;gap:6px;margin-top:10px;
  position:relative;z-index:1;
}
.kotoba-btn-copy{
  flex:1;padding:7px 10px;
  border-radius:var(--r-sm);border:1px solid var(--border);
  background:var(--surface-soft);color:var(--muted);
  font-family:inherit;font-size:11px;cursor:pointer;
  transition:all 0.2s;
}
.kotoba-btn-copy:hover{background:var(--border);color:var(--dark);}
.kotoba-btn-add{
  flex:1;padding:7px 10px;
  border-radius:var(--r-sm);border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;font-family:inherit;font-size:11px;cursor:pointer;
  transition:opacity 0.2s;white-space:nowrap;
}
.kotoba-btn-add:hover{opacity:0.85;}
.kotoba-copied{
  font-size:11px;color:var(--green);
  opacity:0;transition:opacity 0.3s;
  display:block;margin-top:5px;text-align:center;
  height:16px;
}
.kotoba-copied.show{opacity:1;}

/* ── CONTROLS BAR ── */
.controls-bar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 24px;
  position:sticky;top:58px;z-index:100;
}
.tabs-row{
  display:flex;align-items:center;
  border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;
  gap:0;
}
.tabs-row::-webkit-scrollbar{display:none;}
.tab-btn{
  padding:12px 17px;border:none;background:transparent;
  font-family:inherit;font-size:14px;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:all 0.2s;white-space:nowrap;
}
.tab-btn:hover{color:var(--dark);}
.tab-btn.t-all{
  background:var(--dark);color:#fff;border-radius:var(--r-pill);
  border-bottom:2px solid transparent;
  padding:8px 18px;margin:6px 8px 6px 0;
}
.tab-btn.active-line{color:var(--dark);font-weight:600;border-bottom-color:var(--accent);}
.sort-wrap{margin-left:auto;flex-shrink:0;padding:8px 0;}
.sort-sel{
  padding:6px 10px;border:1px solid var(--border);
  border-radius:var(--r-sm);font-family:inherit;
  font-size:12px;color:var(--muted);background:var(--surface);
  cursor:pointer;outline:none;
}
.tags-row{
  display:flex;gap:5px;padding:10px 0 12px;
  overflow-x:auto;scrollbar-width:none;
}
.tags-row::-webkit-scrollbar{display:none;}
.tag-pill{
  padding:6px 14px;border-radius:var(--r-pill);
  border:1px solid var(--border);background:var(--surface);
  font-size:13px;color:var(--muted);cursor:pointer;
  transition:all 0.2s;white-space:nowrap;font-family:inherit;
}
.tag-pill:hover{border-color:var(--accent);color:var(--accent);}
.tag-pill.active{border-color:var(--accent);background:var(--surface-soft);color:var(--accent);font-weight:500;}

/* ── CONTENT PANEL ── */
.content-panel{padding:16px 24px;flex:1;}
.cards-list{display:flex;flex-direction:column;gap:8px;}
.empty-st{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;}

/* ── ITEM CARD ── */
.icard{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);box-shadow:0 1px 4px var(--shadow);
  transition:all 0.2s;overflow:hidden;
}
.icard:hover{box-shadow:0 3px 10px var(--shadow-md);border-color:#D4C4B8;}
.icard.posted{border-left:3px solid var(--green);}
.icard.dragging{opacity:0.4;}
.icard.drag-over{border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,0.08);}

.card-top{display:flex;align-items:flex-start;gap:9px;padding:13px 14px;cursor:pointer;}
.drag-h{color:#C8B8AC;font-size:13px;flex-shrink:0;cursor:grab;margin-top:2px;user-select:none;}
.drag-h:active{cursor:grabbing;}
.card-cnt{flex:1;min-width:0;}
.card-ttl{font-size:15px;font-weight:600;color:var(--dark);line-height:1.45;margin-bottom:6px;}
.ctags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;}
.ctag{
  font-size:12px;border-radius:var(--r-pill);
  padding:3px 10px;font-weight:500;
  display:inline-flex;align-items:center;gap:3px;
}
.ctag-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.card-preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:3px;opacity:0.8;}
.mi{display:flex;align-items:center;gap:3px;font-size:13px;color:var(--muted);}
.mdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.mdot-green{background:var(--green);}
.mdot-amber{background:#999999;}
.mdot-blue{background:#555555;}
.mdot-purple{background:#333333;}
.mdot-gray{background:#CCCCCC;}
.mdot-darkgray{background:#777777;}
.mdot-black{background:#111111;}
.st-posted{color:var(--green);}
.st-sched{color:#999999;}
.st-writing{color:#555555;}
.st-wdraft{color:#888888;}
.st-bodydone{color:#111111;font-weight:600;}
.st-note{color:#333333;}
.st-draft{color:var(--muted);}
.icard.writing_draft{border-left:3px solid #CCCCCC;}
.icard.writing{border-left:3px solid #888888;}
.icard.body_done{border-left:3px solid #111111;}
.icard.scheduled{border-left:3px solid #999999;}
.icard.posted{border-left:3px solid var(--green) !important;}
.icard.note_posted{border-left:3px solid #333333;}
.memo-b{font-size:12px;color:var(--muted);background:var(--surface-soft);border:1px solid var(--border);border-radius:4px;padding:2px 8px;}
.card-acts{display:flex;align-items:center;gap:3px;flex-shrink:0;}
.act-btn{padding:7px 12px;border-radius:var(--r-sm);border:none;font-family:inherit;font-size:13px;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.act-copy{background:var(--surface-soft);color:var(--muted);}
.act-copy:hover{background:var(--border);color:var(--dark);}
.act-more{background:transparent;color:var(--muted);padding:5px 7px;font-size:16px;line-height:1;border:none;cursor:pointer;border-radius:var(--r-sm);}
.act-more:hover{background:var(--surface-soft);}
.chev{color:var(--muted);font-size:11px;flex-shrink:0;transition:transform 0.2s;margin-top:3px;}
.chev.open{transform:rotate(180deg);}

/* Card expanded body = edit form */
.card-body{display:none;border-top:2px solid var(--accent);padding:16px;background:#FDFAF7;}
.card-body.open{display:block;}
.copy-area{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:11px 13px;
  font-size:13px;color:var(--muted);line-height:1.7;
  white-space:pre-wrap;word-break:break-word;
  margin-bottom:0;
}
.copied-msg{font-size:12px;color:var(--green);opacity:0;transition:opacity 0.3s;}
.copied-msg.show{opacity:1;}

/* ── AI COPY BUTTON ── */
.btn-cp-ai{
  padding:9px 16px;
  background:linear-gradient(135deg,#4A7FC1,#2E5FA3);
  color:#fff;border:none;border-radius:var(--r-sm);
  font-family:inherit;font-size:13px;cursor:pointer;
  transition:opacity 0.2s;
}
.btn-cp-ai:hover{opacity:0.85;}

/* Shared form fields */
.fl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0.4px;margin-bottom:5px;display:block;}
.fi{
  width:100%;padding:10px 13px;
  border:1px solid var(--border);border-radius:var(--r-sm);
  font-family:inherit;font-size:14px;
  background:var(--surface);color:var(--text);
  outline:none;transition:border-color 0.2s,box-shadow 0.2s;
  margin-bottom:10px;
}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,0.06);}
textarea.fi{min-height:180px;resize:vertical;}
@media(min-width:900px){textarea.fi{min-height:840px;}}
.fi-row{display:flex;gap:8px;}
.fi-row .fi-g{flex:1;}
.fi-g .fi{margin-bottom:0;}

/* Card action row */
.card-action-row{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  margin-top:14px;padding-top:12px;
  border-top:1px solid var(--border);
}
.btn-save{
  padding:10px 22px;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;border:none;border-radius:var(--r-sm);
  font-family:inherit;font-size:14px;font-weight:600;
  cursor:pointer;transition:opacity 0.2s;
}
.btn-save:hover{opacity:0.88;}
.btn-cp-full{
  padding:9px 16px;background:var(--surface);color:var(--dark);
  border:1px solid var(--border);border-radius:var(--r-sm);
  font-family:inherit;font-size:13px;cursor:pointer;transition:all 0.15s;
}
.btn-cp-full:hover{background:var(--surface-soft);}
.btn-cancel{
  padding:9px 14px;background:transparent;color:var(--muted);
  border:none;border-radius:var(--r-sm);font-family:inherit;
  font-size:13px;cursor:pointer;margin-left:auto;
}
.btn-cancel:hover{color:var(--dark);}
/* copy preview section label */
.copy-section-label{font-size:11px;color:var(--muted);letter-spacing:0.5px;margin-bottom:6px;margin-top:14px;}

/* ── QUICK MEMO ── */
.quick-memo{
  display:flex;gap:8px;align-items:center;
  padding:10px 24px;
  background:var(--surface);border-bottom:1px solid var(--border);
}
.quick-memo-input{
  flex:1;padding:9px 13px;
  border:1px solid var(--border);border-radius:var(--r-sm);
  font-family:inherit;font-size:14px;
  background:var(--surface-soft);color:var(--text);
  outline:none;transition:border-color 0.2s,box-shadow 0.2s;
}
.quick-memo-input:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,0.06);
  background:var(--surface);
}
.quick-memo-btn{
  padding:9px 16px;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;border:none;border-radius:var(--r-sm);
  font-family:inherit;font-size:14px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:opacity 0.2s;flex-shrink:0;
}
.quick-memo-btn:hover{opacity:0.88;}

/* ── CHAR COUNTER ── */
.char-counter-wrap{position:relative;}
.char-counter{
  position:absolute;bottom:14px;right:10px;
  font-size:11px;color:var(--muted);pointer-events:none;
  transition:color 0.2s;
}
.char-counter.warn{color:#C9953A;}
.char-counter.over{color:#C95F5F;font-weight:600;}
.char-bar{
  height:2px;border-radius:1px;
  background:var(--border);margin-top:-6px;margin-bottom:9px;overflow:hidden;
}
.char-bar-fill{height:100%;border-radius:1px;background:var(--accent);transition:width 0.2s,background 0.2s;}

.fl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0.4px;margin-bottom:5px;display:block;}
.fi{
  width:100%;padding:10px 13px;
  border:1px solid var(--border);border-radius:var(--r-sm);
  font-family:inherit;font-size:14px;
  background:var(--surface);color:var(--text);
  outline:none;transition:border-color 0.2s,box-shadow 0.2s;
  margin-bottom:9px;
}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,0.06);}
textarea.fi{min-height:72px;resize:vertical;}
.fi-row{display:flex;gap:8px;}
.fi-row .fi-g{flex:1;}
.fi-g .fi{margin-bottom:0;}
.form-acts{display:flex;gap:7px;margin-top:4px;}
.btn-save{flex:1;padding:9px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border:none;border-radius:var(--r-sm);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:opacity 0.2s;}
.btn-save:hover{opacity:0.88;}
.btn-cancel{padding:9px 14px;background:var(--surface-soft);color:var(--muted);border:1px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:13px;cursor:pointer;}

/* ── ADD FORM MODAL ── */
.modal-bg{
  display:none;position:fixed;inset:0;z-index:400;
  background:rgba(0,0,0,0.45);
  align-items:center;justify-content:center;
  padding:20px;
}
.modal-bg.open{display:flex;}
.modal-box{
  background:var(--surface);border-radius:var(--r);
  padding:24px;width:100%;max-width:480px;
  max-height:90vh;overflow-y:auto;
  box-shadow:0 16px 48px var(--shadow-md);
}
.modal-title{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:18px;letter-spacing:0.5px;padding-bottom:12px;border-bottom:1px solid var(--border);}

/* ── NOTE VIEW ── */
.note-wrap{padding:24px;}
.note-desc{font-size:14px;color:var(--muted);margin-bottom:18px;}
.ng-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 4px var(--shadow);padding:18px;margin-bottom:10px;}
.ng-hdr{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
.ng-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.ng-name{font-size:16px;font-weight:700;color:var(--dark);}
.ng-cnt{font-size:13px;color:var(--muted);font-weight:400;}
.ni{display:flex;gap:7px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--surface-soft);}
.ni:last-of-type{border-bottom:none;}
.ni-dash{font-size:13px;color:var(--accent);margin-top:2px;flex-shrink:0;}

/* ── SETTINGS ── */

.settings-title{font-size:16px;font-weight:700;color:var(--dark);margin-bottom:20px;letter-spacing:0.5px;}
.settings-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:12px;}

.settings-btn{

.tag-manager-row.drag-over-tag{border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,0.08);}

.tag-color-dot{

}

}
.tag-cnt-badge{font-size:11px;color:var(--muted);flex-shrink:0;white-space:nowrap;}
.tag-del-btn{

/* Color picker popup */
.color-picker-pop{

/* ── CTX MENU ── */
.ctx-menu{position:fixed;z-index:500;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);box-shadow:0 8px 24px var(--shadow-md);padding:4px;min-width:150px;display:none;}

<script>
// ── SUPABASE ──
const SB_URL='https://xlndaswechgrukfxtpbk.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsbmRhc3dlY2hncnVrZnh0cGJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3ODc0MjcsImV4cCI6MjA5NTM2MzQyN30.FYKXsG6rsZkC7LJAJkuup31i1HKGjBfJoIMH6t4AAcE';
const sb=supabase.createClient(SB_URL,SB_KEY);

async function syncToSupabase(){
  try{
    const rows=items.map((item,idx)=>({
      id:Math.floor(Number(item.id)),  // 整数に変換
      title:item.title||'',
      body:item.body||'',
      tag:item.tag||'',
      status:item.status||'draft',
      post_date:item.postDate||'',
      note_group:item.noteGroup||'',
      sort_order:idx
      // updated_at は DB の DEFAULT に任せる
    }));
    const {error:e1}=await sb.from('musubi_items').upsert(rows,{onConflict:'id'});
    if(e1) console.warn('items upsert error:',e1);
    const {error:e2}=await sb.from('musubi_settings').upsert([
      {key:'tags',value:JSON.stringify(TAGS)},
      {key:'tag_colors',value:JSON.stringify(TAG_C)},
      {key:'note_groups',value:JSON.stringify(NOTE_GROUPS)}
    ],{onConflict:'key'});
    if(e2) console.warn('settings upsert error:',e2);
  }catch(e){console.warn('Supabase sync failed:',e);}
}

async function deleteFromSupabase(id){
  try{await sb.from('musubi_items').delete().eq('id',Math.floor(Number(id)));}
  catch(e){console.warn('Supabase delete failed:',e);}
}

async function manualSync(){
  // 手動同期：件数が多い方を正として双方向マージ
  showToast('同期中…');
  try{
    const {data:rows}=await sb.from('musubi_items').select('*').order('sort_order');
    if(rows&&rows.length>items.length){
      // Supabaseの方が多い → ダウンロード
      items=rows.map(r=>({id:r.id,title:r.title,body:r.body||'',tag:r.tag||TAGS[0],status:r.status||'draft',postDate:r.post_date||'',noteGroup:r.note_group||''}));
      localStorage.setItem('musubi_v3',JSON.stringify(items));
      render();showToast('Supabaseから同期しました ✓');
    } else {
      // ローカルの方が多い → アップロード
      await syncToSupabase();
      showToast('Supabaseへ保存しました ✓');
    }
  }catch(e){showToast('同期失敗 — オフラインモード');console.warn(e);}
}

async function loadFromSupabase(){
  showToast('同期中…');
  try{
    const[{data:rows,error:e1},{data:settings,error:e2}]=await Promise.all([
      sb.from('musubi_items').select('*').order('sort_order'),
      sb.from('musubi_settings').select('*')
    ]);
    if(e1||e2) throw e1||e2;

    if(rows&&rows.length>0){
      // Supabaseにデータあり かつ ローカルより多い → Supabaseを使う
      if(rows.length >= items.length){
        items=rows.map(r=>({
          id:r.id,title:r.title,body:r.body||'',
          tag:r.tag||TAGS[0],status:r.status||'draft',
          postDate:r.post_date||'',noteGroup:r.note_group||''
        }));
        localStorage.setItem('musubi_v3',JSON.stringify(items));
      } else {
        // ローカルの方が多い → ローカルをSupabaseへ
        await syncToSupabase();
      }
    } else if(items.length>0){
      // Supabaseが空 → ローカルのデータをSupabaseへアップロード
      showToast('初回アップロード中…');
      await syncToSupabase();
    }

    if(settings){
      const t=settings.find(s=>s.key==='tags');
      const c=settings.find(s=>s.key==='tag_colors');
      if(t?.value){TAGS=JSON.parse(t.value);localStorage.setItem('musubi_tags',JSON.stringify(TAGS));}
      if(c?.value){TAG_C=JSON.parse(c.value);localStorage.setItem('musubi_tag_colors',JSON.stringify(TAG_C));}
      const ng=settings.find(s=>s.key==='note_groups');
      if(ng?.value){NOTE_GROUPS=JSON.parse(ng.value);localStorage.setItem('musubi_note_groups',JSON.stringify(NOTE_GROUPS));}
    }
    showToast('同期完了 ✓');
  }catch(e){
    console.warn('Supabase load failed, using localStorage:',e);
    showToast('オフラインモード');
  }
  render();
}

let NOTE_GROUPS=JSON.parse(localStorage.getItem('musubi_note_groups')||'null')||["ワークショップ入門","集客の基本","マインドセット"];
function saveNoteGroupsData(){
  localStorage.setItem('musubi_note_groups',JSON.stringify(NOTE_GROUPS));
  syncToSupabase();
}

// タグカラーのプリセットパレット（背景色, 文字色）

function saveEdit(id){
  const ttl=document.getElementById('e_ttl_'+id);
  const body=document.getElementById('e_body_'+id);
  const tag=document.getElementById('e_tag_'+id);
  const date=document.getElementById('e_date_'+id);
  const st=document.getElementById('e_st_'+id);
  const ng=document.getElementById('e_ng_'+id);
  if(!ttl||!ttl.value.trim()){ttl&&ttl.focus();return;}
  items=items.map(i=>i.id!==id?i:{

    noteGroup:ng.value,
  });

  save();render();showToast('保存しました ✓');
}

function showCtxMenu(e,id){
  e.stopPropagation();
  const item=items.find(i=>i.id===id);
  const menu=document.getElementById('ctxMenu');
  menu.innerHTML=`
    <button class="ctx-item" onclick="moveToTop(${id});hideCtx()">⬆ 先頭へ移動</button>
    <button class="ctx-item" onclick="moveToBottom(${id});hideCtx()">⬇ 末尾へ移動</button>
    ${item.status!=='posted'&&item.status!=='note_posted'?`<button class="ctx-item" onclick="markPosted(${id});hideCtx()">✅ Discord投稿済みにする</button>`:''}
    ${item.status==='posted'?`<button class="ctx-item" onclick="markNotePosted(${id});hideCtx()">📝 Note転載済みにする</button>`:''}
    <button class="ctx-item danger" onclick="deleteItem(${id})">🗑️ 削除</button>`;
  const x=Math.min(e.clientX,window.innerWidth-170);
  const y=Math.min(e.clientY,window.innerHeight-130);
  menu.style.left=x+'px';menu.style.top=y+'px';menu.style.display='block';
  setTimeout(()=>document.addEventListener('click',hideCtx,{once:true}),10);
}
function hideCtx(){document.getElementById('ctxMenu').style.display='none';}

function moveToTop(id){
  const i=items.findIndex(x=>x.id===id);
  if(i>0){items.unshift(items.splice(i,1)[0]);save();render();}
}
function moveToBottom(id){
  const i=items.findIndex(x=>x.id===id);
  if(i<items.length-1){items.push(items.splice(i,1)[0]);save();render();}
}

function markPosted(id){
  items=items.map(i=>i.id===id?{...i,status:'posted',postDate:today.replace(/-/g,'/')}:i);
  hideCtx();save();render();showToast('Discord投稿済みにしました ✓');
}
function markNotePosted(id){
  items=items.map(i=>i.id===id?{...i,status:'note_posted'}:i);
  hideCtx();save();render();showToast('Note転載済みにしました ✓');
}

// ── PHASES ──
const PHASES=[
  {n:1,label:'Phase 1',sub:'Discordで刻む',goal:30,color:'#AAAAAA'},
  {n:2,label:'Phase 2',sub:'Note転載開始',goal:50,color:'#888888'},
  {n:3,label:'Phase 3',sub:'Noteマガジン化',goal:100,color:'#555555'},
  {n:4,label:'Phase 4',sub:'有料コミュニティ',goal:150,color:'#333333'},
  {n:5,label:'Phase 5',sub:'教材化',goal:200,color:'#111111'},
];

function renderPhaseCard(){
  const el=document.getElementById('phaseCard');
  if(!el) return;
  const posted=items.filter(i=>i.status==='posted'||i.status==='note_posted').length;
  const phase=PHASES.find(p=>posted<p.goal)||PHASES[PHASES.length-1];
  const prev=PHASES[phase.n-2];
  const base=prev?prev.goal:0;
  const pct=Math.min((posted-base)/(phase.goal-base)*100,100);
  const remaining=Math.max(phase.goal-posted,0);

  // 週ペース
  const weekStart=getWeekStart(new Date());
  const thisWeek=items.filter(i=>{
    if(!i.postDate||(i.status!=='posted'&&i.status!=='note_posted')) return false;
    const d=new Date(i.postDate.replace(/\//g,'-'));
    return d>=weekStart;
  }).length;
  const weekGoal=2;

  // ストリーク（連続投稿週数）
  const streak=calcStreak();

  el.innerHTML=`
  <div class="phase-card" style="--phase-color:${phase.color}">
    <div class="phase-header">
      <span class="phase-label">${phase.label}</span>
      <span class="phase-sub">${phase.sub}</span>
    </div>
    <div class="phase-count">${posted}<span> / ${phase.goal}本</span></div>
    <div class="phase-bar-track"><div class="phase-bar-fill" style="width:${pct}%"></div></div>
    <div class="phase-next">${remaining>0?`次のフェーズまで <strong>${remaining}本</strong>`:'🎉 フェーズ達成！'}</div>
    <div class="pace-row">
      ${Array.from({length:weekGoal},(_,i)=>`<div class="pace-dot${i<thisWeek?' done':''}"></div>`).join('')}
      <span class="pace-label">今週 ${thisWeek}/${weekGoal}本</span>
    </div>
    ${streak>0?`<div class="pace-streak">🔥 ${streak}週連続投稿中</div>`:''}
  </div>`;
}

function getWeekStart(d){
  const day=d.getDay();
  const diff=d.getDate()-day+(day===0?-6:1);
  const mon=new Date(d);mon.setDate(diff);mon.setHours(0,0,0,0);return mon;
}

function calcStreak(){
  const posted=items.filter(i=>i.postDate&&(i.status==='posted'||i.status==='note_posted'));
  if(!posted.length) return 0;
  // 各アイテムをISO週に変換
  const weeks=new Set(posted.map(i=>{
    const d=new Date(i.postDate.replace(/\//g,'-'));
    const mon=getWeekStart(d);
    return mon.toISOString().slice(0,10);
  }));
  // 今週から過去に向かって連続チェック
  let streak=0;
  let cur=getWeekStart(new Date());
  while(true){
    const key=cur.toISOString().slice(0,10);
    if(weeks.has(key)){
      streak++;
      cur.setDate(cur.getDate()-7);
    } else {
      // 今週まだ投稿なしなら先週から数える
      if(streak===0){cur.setDate(cur.getDate()-7);if(weeks.has(cur.toISOString().slice(0,10))){continue;}}
      break;
    }
  }
  return streak;
}

// ── COPY CORE ──
const _copyStore = {}; // id -> {title, full}

function _doCopy(text){
  return new Promise((resolve, reject) => {
    // Try Clipboard API first
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(resolve).catch(()=>{
        _execCommandCopy(text) ? resolve() : reject();
      });
    } else {
      _execCommandCopy(text) ? resolve() : reject();
    }
  });
}

function _execCommandCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none;';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e){ return false; }
}

function copyKotobaInline(){
  const text = document.getElementById('kotobaText').innerText;
  _doCopy(text).then(()=>{
    const el = document.getElementById('kotobaCopied');

    showToast('コピーしました！');
  }).catch(()=>showToast('コピーできませんでした'));
}

function updateCharCount(textareaId,barId,cntId,limit){
  const ta=document.getElementById(textareaId);
  const bar=document.getElementById(barId);

  if(!ta||!bar||!cnt) return;
  const len=ta.value.length;

function onDragStart(id){draggingId=id;document.getElementById('card_'+id)?.classList.add('dragging');}
function onDragOver(e,id){e.preventDefault();document.querySelectorAll('.icard').forEach(c=>c.classList.remove('drag-over'));document.getElementById('card_'+id)?.classList.add('drag-over');}
function onDrop(e,toId){
  e.preventDefault();
  if(!draggingId||draggingId===toId) return;
  const from=items.findIndex(i=>i.id===draggingId);
  const to=items.findIndex(i=>i.id===toId);
  if(from===-1||to===-1) return;
  const u=[...items];const[m]=u.splice(from,1);u.splice(to,0,m);
  items=u;draggingId=null;save();render();
}
function onDragEnd(){draggingId=null;document.querySelectorAll('.icard').forEach(c=>c.classList.remove('dragging','drag-over'));}

// ── BULK IMPORT ──
function bulkImport(){
  const raw=document.getElementById('bulkImportText').value;
  const tag=document.getElementById('bulkImportTag').value||TAGS[0];
  if(!raw.trim()){showToast('テキストを入力してください');return;}
  const existing=new Set(items.map(i=>i.title));
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const toAdd=[];
  lines.forEach(line=>{
    // 「01｜タイトル」「1. タイトル」「- タイトル」など番号・記号を除去
    const title=line.replace(/^[\d０-９]+[｜|．.\-\s。、]+/,'').trim();
    if(title&&!existing.has(title)){
      existing.add(title);
      toAdd.push({id:Date.now()+Math.random(),title,body:'',tag,status:'draft',postDate:'',noteGroup:''});
    }
  });
  if(toAdd.length===0){showToast('追加できる新しいタイトルがありませんでした');return;}
  items=[...items,...toAdd];
  save();
  document.getElementById('bulkImportText').value='';
  render();
  showToast(`${toAdd.length}件追加しました！`);
}

function getFiltered(){
  let list=[...items];
  if(page==='posted') return list.filter(i=>i.status==='posted');
  if(activeTab==='draft') list=list.filter(i=>i.status==='draft');
  else if(activeTab==='writing_draft') list=list.filter(i=>i.status==='writing_draft');
  else if(activeTab==='writing') list=list.filter(i=>i.status==='writing');
  else if(activeTab==='body_done') list=list.filter(i=>i.status==='body_done');
  else if(activeTab==='scheduled') list=list.filter(i=>i.status==='scheduled');
  else if(activeTab==='posted') list=list.filter(i=>i.status==='posted');
  else if(activeTab==='note_posted') list=list.filter(i=>i.status==='note_posted');
  else if(activeTab==='note_done') list=list.filter(i=>i.noteGroup);
  if(activeTag!=='すべて') list=list.filter(i=>i.tag===activeTag);
  const sort=document.getElementById('sortSel')?.value||'default';
  if(sort==='date_asc') list.sort((a,b)=>a.postDate.localeCompare(b.postDate));
  else if(sort==='date_desc') list.sort((a,b)=>b.postDate.localeCompare(a.postDate));
  else if(sort==='title') list.sort((a,b)=>a.title.localeCompare(b.title,'ja'));
  return list;
}

  }).join('');

  panel.innerHTML=`<div class="settings-wrap">
    <div class="settings-title">設定</div>

    <div class="settings-card">
      <div class="settings-card-title">📓 Noteグループ管理</div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">ドラッグで並び替え、名前をクリックで編集</p>
      <div class="tag-manager-list" id="ngManagerList">${NOTE_GROUPS.map((g,i)=>`
        <div class="tag-manager-row" id="ngr_${i}"
          draggable="true"
          ondragstart="ngDragStart(${i})"
          ondragover="ngDragOver(event,${i})"
          ondrop="ngDrop(event,${i})"
          ondragend="ngDragEnd()">
          <span class="tag-drag-h">⠿</span>
          <input class="tag-name-input" id="ngi_${i}" value="${esc(g)}"
            onblur="renameNoteGroup(${i},this.value)"
            onkeydown="if(event.key==='Enter')this.blur()">
          <span class="tag-cnt-badge">${items.filter(it=>it.noteGroup===g).length}件</span>
          <button class="tag-del-btn" onclick="deleteNoteGroup(${i})" title="削除">✕</button>
        </div>`).join('')}
      </div>
      <div class="tag-add-row">
        <input class="tag-add-input" id="ngAddInput" placeholder="新しいグループ名を入力"
          onkeydown="if(event.key==='Enter')addNoteGroup()">
        <button class="tag-add-btn" onclick="addNoteGroup()">＋ 追加</button>
      </div>
    </div>

    <div class="settings-card">
      <div class="settings-card-title">🏷️ タグ管理</div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">ドラッグで並び替え、タグ名をクリックで編集、色の丸をクリックで色変更</p>
      <div class="tag-manager-list" id="tagManagerList">${tagRows}</div>
      <div class="tag-add-row">
        <input class="tag-add-input" id="tagAddInput" placeholder="新しいタグ名を入力" maxlength="20"
          onkeydown="if(event.key==='Enter')addTag()">
        <button class="tag-add-btn" onclick="addTag()">＋ 追加</button>
      </div>
    </div>

    <div class="settings-card">
      <div class="settings-card-title">📥 タイトル一括インポート</div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:10px;">タイトルを1行1件で貼り付け。番号付き（例: <code style="background:var(--surface-soft);padding:1px 5px;border-radius:3px;">01｜タイトル</code>）でもOK。重複はスキップ。</p>
      <textarea class="fi" id="bulkImportText" style="min-height:120px;font-size:13px;" placeholder="01｜タイトル&#10;02｜タイトル&#10;タイトルだけでもOK"></textarea>
      <div class="fi-row" style="margin-bottom:10px;">
        <div class="fi-g">
          <label class="fl">デフォルトタグ</label>
          <select class="fi" id="bulkImportTag" style="margin-bottom:0"></select>
        </div>
        <div class="fi-g" style="display:flex;align-items:flex-end;">
          <button class="btn-save" style="width:100%;margin-bottom:0;" onclick="bulkImport()">追加する</button>
        </div>

    <div class="settings-card">
      <div class="settings-card-title">データ管理</div>
      <button class="settings-btn" onclick="loadNeta50()">📥 プリセット100件を読み込む（重複スキップ）</button>
      <button class="settings-btn" onclick="exportData()">📤 データをエクスポート（JSON）</button>
      <button class="settings-btn danger" onclick="if(confirm('全データを削除しますか？この操作は元に戻せません。')){localStorage.removeItem('musubi_v3');items=[];save();render();showToast('データを削除しました');}">🗑️ 全データを削除</button>
    </div>
    <div class="settings-footer">MUSUBI Community © 2025</div>
  </div>`;
  // タグセレクトを埋める
  const sel=document.getElementById('bulkImportTag');
  if(sel) TAGS.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);});
}

// ── NOTE GROUP MANAGEMENT ──
let ngDragging=null;

function addNoteGroup(){
  const inp=document.getElementById('ngAddInput');
  const name=inp.value.trim();
  if(!name) return;
  if(NOTE_GROUPS.includes(name)){showToast('同じ名前のグループがあります');return;}
  NOTE_GROUPS.push(name);
  inp.value='';
  saveNoteGroupsData();render();showToast(`グループ「${name}」を追加しました`);
}

function renameNoteGroup(i,newName){
  newName=newName.trim();
  const old=NOTE_GROUPS[i];
  if(!newName||newName===old) return;
  if(NOTE_GROUPS.includes(newName)){showToast('同じ名前のグループがあります');render();return;}
  NOTE_GROUPS[i]=newName;
  items=items.map(it=>it.noteGroup===old?{...it,noteGroup:newName}:it);
  save();saveNoteGroupsData();render();showToast(`「${old}」→「${newName}」に変更しました`);
}

function deleteNoteGroup(i){
  const name=NOTE_GROUPS[i];
  const cnt=items.filter(it=>it.noteGroup===name).length;
  const msg=cnt>0?`グループ「${name}」を削除しますか？\n（${cnt}件のネタはグループ未設定になります）`:`グループ「${name}」を削除しますか？`;
  if(!confirm(msg)) return;
  NOTE_GROUPS.splice(i,1);
  items=items.map(it=>it.noteGroup===name?{...it,noteGroup:''}:it);
  save();saveNoteGroupsData();render();showToast(`グループ「${name}」を削除しました`);
}

function ngDragStart(i){ngDragging=i;document.getElementById('ngr_'+i)?.classList.add('dragging');}
function ngDragOver(e,i){
  e.preventDefault();
  document.querySelectorAll('#ngManagerList .tag-manager-row').forEach(r=>r.classList.remove('drag-over-tag'));
  document.getElementById('ngr_'+i)?.classList.add('drag-over-tag');
}
function ngDrop(e,toI){
  e.preventDefault();
  if(ngDragging===null||ngDragging===toI) return;
  const moved=NOTE_GROUPS.splice(ngDragging,1)[0];
  NOTE_GROUPS.splice(toI,0,moved);
  ngDragging=null;
  saveNoteGroupsData();render();
}
function ngDragEnd(){
  ngDragging=null;
  document.querySelectorAll('#ngManagerList .tag-manager-row').forEach(r=>r.classList.remove('dragging','drag-over-tag'));
}

// ── TAG MANAGEMENT ──
let tagDragging=null;

function addTag(){
  const inp=document.getElementById('tagAddInput');
  const name=inp.value.trim();
  if(!name) return;
  if(TAGS.includes(name)){showToast('同じ名前のタグがあります');return;}
  const colors=assignTagColor(name);
  TAGS.push(name);
  TAG_C[name]=colors;
  inp.value='';
  saveTagsData();render();showToast(`タグ「${name}」を追加しました`);
}

function renameTag(i,newName){
  newName=newName.trim();
  const old=TAGS[i];
  if(!newName||newName===old) return;
  if(TAGS.includes(newName)){showToast('同じ名前のタグがあります');render();return;}
  TAGS[i]=newName;
  TAG_C[newName]=TAG_C[old];
  delete TAG_C[old];
  // update items
  items=items.map(it=>it.tag===old?{...it,tag:newName}:it);
  save();saveTagsData();render();showToast(`「${old}」→「${newName}」に変更しました`);
}

function deleteTag(i){
  const name=TAGS[i];
  const cnt=items.filter(it=>it.tag===name).length;
  const msg=cnt>0?`タグ「${name}」を削除しますか？\n（${cnt}件のネタはタグなしになります）`:`タグ「${name}」を削除しますか？`;
  if(!confirm(msg)) return;
  TAGS.splice(i,1);
  delete TAG_C[name];
  items=items.map(it=>it.tag===name?{...it,tag:TAGS[0]||''}:it);
  save();saveTagsData();render();showToast(`タグ「${name}」を削除しました`);
}

function tagDragStart(i){tagDragging=i;document.getElementById('tmr_'+i)?.classList.add('dragging');}
function tagDragOver(e,i){
  e.preventDefault();
  document.querySelectorAll('.tag-manager-row').forEach(r=>r.classList.remove('drag-over-tag'));
  document.getElementById('tmr_'+i)?.classList.add('drag-over-tag');
}
function tagDrop(e,toI){
  e.preventDefault();
  if(tagDragging===null||tagDragging===toI) return;
  const moved=TAGS.splice(tagDragging,1)[0];
  TAGS.splice(toI,0,moved);
  tagDragging=null;
  saveTagsData();render();
}
function tagDragEnd(){
  tagDragging=null;
  document.querySelectorAll('.tag-manager-row').forEach(r=>r.classList.remove('dragging','drag-over-tag'));
}

// ── COLOR PICKER ──
let colorPickerTarget=null;
function openColorPicker(e,i){
  e.stopPropagation();
  const pop=document.getElementById('colorPickerPop');
  const currentBg=getTagColor(TAGS[i])[0];
  pop.innerHTML=TAG_PALETTE.map((p,pi)=>`
    <div class="cp-swatch${p[0]===currentBg?' selected':''}"
      style="background:${p[1]};border-color:${p[0]===currentBg?'var(--dark)':'transparent'}"
      onclick="applyTagColor(${i},${pi})"></div>`).join('');
  const r=e.currentTarget.getBoundingClientRect();
  pop.style.left=Math.min(r.left,window.innerWidth-180)+'px';
  pop.style.top=(r.bottom+6)+'px';
  pop.classList.add('open');
  colorPickerTarget=i;
  setTimeout(()=>document.addEventListener('click',closeColorPicker,{once:true}),10);
}
function applyTagColor(i,pi){
  TAG_C[TAGS[i]]=TAG_PALETTE[pi];
  saveTagsData();render();closeColorPicker();showToast('色を変更しました');
}
function closeColorPicker(){
  document.getElementById('colorPickerPop').classList.remove('open');
  colorPickerTarget=null;
}

function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Init
document.addEventListener('scroll',hideCtx,true);
// Supabaseから読み込んでから1回だけrender（スマホのちらつき防止）
const _initTimer=setTimeout(()=>{render();},2500); // 2.5秒でタイムアウトしてローカルで表示
loadFromSupabase().then(()=>clearTimeout(_initTimer)).catch(()=>{clearTimeout(_initTimer);render();});

// Modal bg click to close
document.getElementById('modalBg').addEventListener('click', function(e){
  if(e.target === this) closeModal();
});

// Quick memo: Enter to add
document.getElementById('quickMemoInput').addEventListener('keydown', function(e){
  if(e.key==='Enter'){ e.preventDefault(); addQuickMemo(); }
});

// Modal textarea char count reset on open
const origOpenModal = openModal;
openModal = function(){
  origOpenModal();
  setTimeout(()=>updateCharCount('m_body','m_bar','m_cnt',400),10);
};

</script>
